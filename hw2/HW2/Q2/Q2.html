<!DOCTYPE html>
<head>
<style>

path.link {
  fill: none;
  stroke: #666;
  stroke-width: 1.5px;
}

path.zero {
  fill: none;
  stroke: #666;
  stroke-width: 3px;
}

path.one {
  fill: none;
  stroke: #0f0;
  stroke-width: 0.5px;
  stroke-dasharray: 10, 5;
}

circle.smalldegree {
    fill: #ece2f0
}

circle.mediumdegree {
    fill: #a6bddb
}

circle.largedegree {
    fill: #1c9099
}

circle.pinned {
    fill: #fff
}


circle {
  fill: #ccc;
  stroke: #fff;
  stroke: black;
  stroke-width: 1.5px;
}

text {
  fill: #000;
  font: 10px sans-serif;
  pointer-events: none;
}

</style>
<meta charset="utf-8">
<title></title>
</head>

<body>
<script type="text/javascript" src="../lib/d3.v5.min.js"></script>
<script>

d3.dsv(",", "board_games.csv", function(d) {
  return {
    source: d.source,
    target: d.target,
    value: +d.value
  }
}).then(function(data) {

  debugger;   
  var links = data;

  var nodes = {};


  function addweight(n) {
      if (!Object.hasOwn(n, 'weight')) {
        n.weight = 1;
      } else {
        n.weight += 1;
      }
  }

  // compute the distinct nodes from the links.
  links.forEach(function(link) {
      link.source = nodes[link.source] || (nodes[link.source] = {name: link.source});
      link.target = nodes[link.target] || (nodes[link.target] = {name: link.target});
      // as we are building the links we want to capture the weight
      addweight(link.source);
      addweight(link.target);
  });

  weightSet = new Set();
  links.forEach(function(link) {
      weightSet.add(link.source.weight);
      weightSet.add(link.source.weight);
  });
  const weightArray = [...weightSet];
  console.log(weightArray); 

  var width = 1200,
      height = 700;

  //DO NOT MODIFY THE BELOW BLOCK OF CODE//
  var force = d3.forceSimulation()
      .nodes(d3.values(nodes))
      .force("link", d3.forceLink(links).distance(100))
      .force('center', d3.forceCenter(width / 2, height / 2))
      .force("x", d3.forceX())
      .force("y", d3.forceY())
      .force("charge", d3.forceManyBody().strength(-250))
      .alphaTarget(1)
      .on("tick", tick);
  //DO NOT MODIFY THE ABOVE BLOCK OF CODE//

  var svg = d3.select("body").append("svg")
      .attr("width", width)
      .attr("height", height);

  // add the links
  var path = svg.append("g")
      .selectAll("path")
      .data(links)
      .enter()
      .append("path")
      .attr("class", function(d) { return "link " + d.type; })
      .attr("class", function(d) {
        /*
        Style the edges based on the “value" field in the links array:
            1. If the value of the edge is equal to 0 (not similar), the edge should be gray,
            thick, and solid (The dashed line with zero gap is not considered as solid).
            2. If the value of the edge is equal to 1 (similar), the edge should be green, thin, and dashed.
        */
        return "link " + (d.value === 0 ? "zero" : "one");
      });      

  // define the nodes
  var node = svg.selectAll(".node")
      .data(force.nodes())
      .enter().append("g")
      .attr("class", "node")
      .call(d3.drag()
          .on("start", dragstarted)
          .on("drag", dragged)
          .on("end", dragended))
        .on("dblclick", dblclick);
  

  // add the nodes and be sure to not have duplicate of this section
  node.append("circle")
      .attr("id", function(d){
         return (d.name.replace(/\s+/g,'').toLowerCase());
      })
      .attr("r", function(d) {
        // radius of node is function of weight
        return 10 + d.weight * 2;
      })
      .attr("class", function(d) {
        /*
        weights are in vals [2, 3, 4, 5, 7, 10]
        */
        clrStyle = '';
        if (0 <= d.weight && d.weight < 4) 
        {
          clrStyle = 'smalldegree';
        } else if (d.weight < 8) 
        {
          clrStyle = 'mediumdegree';
        } else
        {
          clrStyle = 'largedegree';
        }
        return clrStyle;
      }); 

  // show the node label at top-right and bold
  node.append("text")
      .attr("x", 8)
      .attr("y", -8)
      .text(function(d) { return d.name; })
      .style("font-weight", "bold");

  // add the curvy lines
  function tick() {
      path.attr("d", function(d) {
          var dx = d.target.x - d.source.x,
              dy = d.target.y - d.source.y,
              dr = Math.sqrt(dx * dx + dy * dy);
          return "M" +
              d.source.x + "," +
              d.source.y + "A" +
              dr + "," + dr + " 0 0,1 " +
              d.target.x + "," +
              d.target.y;
      });

      node.attr("transform", function(d) {
          return "translate(" + d.x + "," + d.y + ")"; 
      });
  };

  function dragstarted(d) {
      if (!d3.event.active) force.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
  };

  function dragged(d) {
      d.fx = d3.event.x;
      d.fy = d3.event.y;
  };

  function dragended(d) {
      if (!d3.event.active) force.alphaTarget(0);
      d.fixed = true;
      d.x = d.fx;
      d.y = d.fy;
      //node = d3.select(this);
      //d3.select(this).classed("pinned", false);
      //node.classed("smalldegree", false);
      //node.classed("mediumdegree", false);
      //node.classed("largedegree", false);

      //force.alpha(0.3).restart();      
  };

  function dblclick(d)
  {
    if (d.fixed)
    {
      d.fixed = false;
      d.fx = null;
      d.fy = null;
      d3.select(this).classed("pinned", false);
      force.alpha(0.3).restart();
    }

  }

  
}).catch(function(error) {
  console.log(error);
});

</script>
</body>
</html>
