<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static Analysis and User Adjusted Sensitivities</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f5f0;
      --ink: #202a2c;
      --muted: #667174;
      --rule: #cbd1cd;
      --red: #c44b42;
      --blue: #2869a5;
      --blue-soft: #dbe9f2;
      --font: Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--paper);
      font-family: var(--font);
    }

    .page {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
      padding: 28px 0;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .chart-panel {
      min-width: 0;
      padding: 12px 24px;
    }

    h2 {
      margin: 0 0 4px;
      font: 400 21px/1.2 var(--font);
    }

    .chart {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .axis-line {
      stroke: #859092;
      stroke-width: 1;
      shape-rendering: crispEdges;
    }

    .axis-label {
      fill: var(--muted);
      font: 16px var(--font);
    }

    .trend-line {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .static-line { stroke: var(--red); }
    .dynamic-line { stroke: var(--blue); }

    .point-hit {
      fill: transparent;
      cursor: ns-resize;
      touch-action: none;
    }

    .point-handle {
      fill: var(--paper);
      stroke: var(--blue);
      stroke-width: 2.5;
      pointer-events: none;
    }

    .point-hit:focus { outline: none; }

    .point-hit:focus + .point-handle {
      fill: var(--blue-soft);
      stroke-width: 3.5;
    }

    @media (max-width: 700px) {
      .page {
        width: min(100% - 32px, 520px);
        padding: 18px 0;
      }

      .charts { grid-template-columns: 1fr; }
      .chart-panel { padding: 22px 16px 18px; }
      .chart-panel + .chart-panel {
        border-top: 1px solid var(--rule);
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="charts" aria-label="Two sensitivity graphs">
      <article class="chart-panel" aria-labelledby="static-title">
        <h2 id="static-title">Static Analysis</h2>
        <svg id="static-chart" class="chart" role="img" aria-label="A red straight line rising across feature and predicted value axes"></svg>
      </article>

      <article class="chart-panel" aria-labelledby="dynamic-title">
        <h2 id="dynamic-title">User Adjusted Sensitivities</h2>
        <svg id="dynamic-chart" class="chart" role="group" aria-label="An interactive blue spline on feature and predicted value axes"></svg>
      </article>
    </section>
  </main>

  <script src="./lib/d3.v5.min.js"></script>
  <script src="./static_vs_dynamic_sensitivities.js"></script>
</body>
</html>
