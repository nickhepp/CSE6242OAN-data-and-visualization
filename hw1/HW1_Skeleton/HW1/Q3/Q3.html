<head>
  <style>    
    /* Define css rules here */
    div.bar {
      display: inline-block;
      width: 20px;
      height: 75px;   /* We'll override height later */
      background-color: teal;

<title></title>

<body>

  <script src="lib/d3/d3.min.js"></script>
  <script src="lib/d3-dsv/d3-dsv.min.js"></script>
  <script src="lib/d3-fetch/d3-fetch.min.js"></script>


  <script>

    const maxElements = 5;

    // define the dimensions and margins for the graph
    var margin = {top: 20, right: 30, bottom: 30, left: 40};
    const width = 1000;
    const height = 1000;


    // create scales x & y for X and Y axis and set their ranges
    // var x = d3.scaleLinear()
    //   .domain([0, 1])
    //   .range([margin.left, width - margin.right]);
    // var y = d3.scaleLinear()
    //   .domain([0, 1])
    //   .range([height - margin.bottom, margin.top]);
    const barHeight = height / maxElements;
    var barPadding = 2;

    // append svg element to the body of the page
    var svg = d3.select("body").append("svg")
	   	// set the id, dimensions and position of the svg element
      .attr("id", "svg1")
      .attr("width", width)
      .attr("height", height);
      
      
	  gContainer = svg.append("g")
	    .attr("id", "container");

    gBars = gContainer.append("g")
	    .attr("id", "bars");


    // Get the data and filter for top 5 most trafficked species
	  var pathToCsv = "q3.csv";		// path to csv
	
    d3.dsv(",", pathToCsv, function (d) {
      return {
        // format data attributes if required, species,count
        species: d.species,  //No conversion
        count: parseInt(d.count)
      }
    }).then(function (data) {
      console.log(data); // you should see the data in your browser's developer tools console 

      // The bar plot must display one bar for each of the five most trafficked species by count. Each bar’s length
      // corresponds to the number of wildlife trafficking incidents involving that species between 2015 and 2023, represented
      // by the “count” column in our dataset.
      const sortedData = data.sort((a, b) => b.count - a.count); 
      sortedData.length = maxElements;

      const maxCount = sortedData[0].count;
      const speciesNames = sortedData.map(dItem => dItem.species);

      /* Create bar plot using data from csv */ 

      // set the domains of X and Y scales based on data
      xScale = d3.scaleLinear()
          .domain([0, maxCount])
          .range([margin.left, width - margin.right]);
      yScale = d3.scaleLinear()
          .domain([0, height])
          .range([height - margin.bottom, margin.top]);

      // Add bars to svg - create new elements based on your data
      gBars.selectAll("rect")
        .data(data)
        .enter()
        .append("rect")
        .attr("x", 0)
        .attr("y", function(d, i) {
          return i * (height / data.length);
        })
        .attr("width", function(d) {
          return d.count * width / maxCount;
        })
        .attr("height", height / data.length - barPadding);


      // Add the X Axis
      xAxis = gContainer.append("g").attr("id", "x_axis");
      
      // Add the text label for X Axis
      xAxisLabel = gContainer
        .append("text")
        .attr("id", "x_axis_label")
        .text("Count");
      //   |
      //   | +-- (x-axis elements)


      // Add the Y Axis
      yAxis = gContainer.append("g").attr("id", "y_axis");

      // Add the text label for Y axis:
      yAxisLabel = gContainer
        .append("text")
        .attr("id", "y_axis_label")
        .text("Species");

      // Add GT username
      gtUsername = gContainer
        .append("text")
        .attr("id", "credit")
        .text("nhepperm3");

      // Add Title
      gtUsername = gContainer
        .append("text")
        .attr("id", "title")
        .text("Wildlife Trafficking Incidents per Species (2015 to 2023)");

+-- <g id="y_axis"> y-axis

    }).catch(function (error) {
      console.log(error);
    });

  </script>
</body>
